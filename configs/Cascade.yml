# dataset and data loader settings
data:
    dataset: "NightRaindrop" # "RainDrop" 
    dataset_type: "Drop"
    image_size: 256
    channels: 3
    num_workers: 1
    data_dir: "/home/gxy/cv/dataset/NightRainDrop_Train"
    conditional: True
    resize: True
    # condition: "Daytime" # "night"
    condition: "Night"

training:
    #-----------Raindrop_DiT, RDiffusion, onego, ICRA--------------
    # patch_n: 4
    # batch_size: 16
    # -----------Cascade--------------
    patch_n: 1
    batch_size: 1
    #-----------atgan--------------
    # patch_n: 1
    # batch_size: 32
    #-----------Raindrop_DiT, RDiffusion--------------
    n_epochs: 50
    #n_epochs: 401
    n_iters: 20000000
    #snapshot_freq: 50
    snapshot_freq: 10
    validation_freq: 5000
    resume: False

sampling:
    batch_size: 1
    last_only: True

optim:
    weight_decay: 0.000
    optimizer: "Adam"
    lr: 0.0001
    amsgrad: False
    eps: 0.00000001

loss:
    pixel_weight: 1
    psnr_weight: 0
    grad_weight: 0
    l2_weight: 0